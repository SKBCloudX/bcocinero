[project]
name = "bcocinero"
version = "0.1.0"
description = "TUI App for burrito"
readme = "README.rst"
authors = [
    { name = "Heechul Kim", email = "jijisa@iorchard.co.kr" }
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0.3",
    "textual>=8.1.1",
    "textual-dev>=1.8.0",
]

[project.scripts]
bcocinero = "bcocinero.app:entrypoint"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

