[project]
name = "bcocinero"
version = "0.1.1"
description = "TUI App for burrito"
authors = [
    { name = "Heechul Kim", email = "jijisa@iorchard.co.kr" }
]
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["burrito", "bcocinero", "TUI"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.9",
]
requires-python = ">=3.9, <3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "rqdb>=1.6.4",
    "textual>=8.1.1",
]

[project.scripts]
bcocinero = "bcocinero.app:entrypoint"
cloudx-tui = "bcocinero.app:entrypoint"
bcocinerod = "bcocinerod.main:main"
bjefe = "bjefe.main:main"

[build-system]
requires = ["uv_build>=0.11.27,<=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["bcocinero", "bcocinerod", "bjefe"]
